[project]
name = "coderhouse-lcel-async"
version = "0.1.0"
description = "Cadena LCEL asíncrona (prompt | modelo | parser): ejercicio del Módulo 2 de AI Engineering (Coderhouse)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1,<2",
    "langchain-core>=1.7,<2",
    "langchain-openai>=1.7,<2",
    "openai>=3.46,<4",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF", "SIM"]
